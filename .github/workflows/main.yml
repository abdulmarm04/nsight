          </div>
        </div>

        <!-- Top Sources of Views -->
        <div class="section-header" style="margin-top: 24px;">
          <span data-editable="true">Top sources of views</span>
          <span class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
        <div class="data-row">
          <div class="label-line" data-editable="true">Reels tab</div>
          <div class="bar-line">
            <div class="bar-bg">
              <div class="bar-fill bg-gradient-pink" id="bar-reels" style="width: 87.2%;"></div>
            </div>
            <span class="percent-value" data-editable="true" data-bar="bar-reels">87.2%</span>
          </div>
        </div>
        <div class="data-row">
          <div class="label-line" data-editable="true">Explore</div>
          <div class="bar-line">
            <div class="bar-bg">
              <div class="bar-fill bg-gradient-pink" id="bar-explore" style="width: 11.6%;"></div>
            </div>
            <span class="percent-value" data-editable="true" data-bar="bar-explore">11.6%</span>
          </div>
        </div>
        <div class="data-row" style="margin-bottom: 24px;">
          <div class="label-line" data-editable="true">Feed</div>
          <div class="bar-line">
