          </div>
        </div>

        <!-- How Long People Watched -->
        <div class="section-header">
          <span data-editable="true">How long people watched your reel</span>
          <span class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
        <div class="mini-player-container">
          <div class="mini-player-wrapper">
            <img class="thumbnail-img second-thumb" id="mini-thumb-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='177' viewBox='0 0 100 177'><rect width='100%' height='100%' fill='%23222222'/></svg>" alt="Mini player">
            <div class="play-icon-overlay">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
          </div>
        </div>

        <!-- Touch Interactive Retention Line Graph -->
        <div class="graph-container" id="retention-graph-container">
          <div class="graph-y-axis">
            <span data-editable="true">100%</span>
            <span data-editable="true">50%</span>
            <span data-editable="true">0%</span>
          </div>
          <div style="padding-left: 36px; height: 100%;">
            <svg class="graph-svg" id="retention-svg" viewBox="0 0 300 120" preserveAspectRatio="none">
              <path id="retention-path" d="" fill="none" stroke="#d800a6" stroke-width="3" stroke-linecap="round"/>
              <!-- Hitboxes created via JS -->
            </svg>
            <div class="graph-x-axis" style="padding-left: 0;">
              <span data-editable="true">0:00</span>
              <span data-editable="true" id="retention-end-time">0:27</span>
