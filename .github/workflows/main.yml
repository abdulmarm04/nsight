      <!-- AUDIENCE TAB CONTENT -->
      <div id="view-audience" class="tab-content">
        <div class="section-header">
          <span data-editable="true">Who viewed your reel</span>
          <span class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
        <div class="data-row">
          <div class="label-line" data-editable="true">Followers</div>
          <div class="bar-line">
            <div class="bar-bg">
              <div class="bar-fill bg-gradient-pink" id="bar-followers" style="width: 1.8%;"></div>
            </div>
            <span class="percent-value" data-editable="true" data-bar="bar-followers">1.8%</span>
          </div>
        </div>
        <div class="data-row" style="margin-bottom: 32px;">
          <div class="label-line" data-editable="true">Non-followers</div>
          <div class="bar-line">
            <div class="bar-bg">
              <div class="bar-fill bg-gradient-purple" id="bar-nonfollowers" style="width: 98.2%;"></div>
            </div>
            <span class="percent-value" data-editable="true" data-bar="bar-nonfollowers">98.2%</span>
          </div>
        </div>

        <div class="section-header">
          <span data-editable="true">Audience details</span>
          <span class="info-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
        </div>
        <div class="pill-group">
          <button class="pill-btn" id="pill-age" onclick="switchAudienceCategory('age')">Age</button>
          <button class="pill-btn active" id="pill-country" onclick="switchAudienceCategory('country')">Country</button>
          <button class="pill-btn" id="pill-gender" onclick="switchAudienceCategory('gender')">Gender</button>
        </div>

        <div id="dynamic-audience-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Audience Category Dynamic Data
    let audienceData = {
      gender: [
        { label: "Men", value: "70.4%", barWidth: "70.4%", colorClass: "bg-gradient-pink" },
        { label: "Women", value: "29.6%", barWidth: "29.6%", colorClass: "bg-gradient-purple" }
      ],
      country: [
        { label: "United States", value: "60.1%", barWidth: "60.1%", colorClass: "bg-gradient-pink" },
        { label: "United Kingdom", value: "8.4%", barWidth: "14%", colorClass: "bg-gradient-pink" },
        { label: "Canada", value: "7.1%", barWidth: "11%", colorClass: "bg-gradient-pink" },
        { label: "Australia", value: "5.5%", barWidth: "8.5%", colorClass: "bg-gradient-pink" },
        { label: "Germany", value: "3.8%", barWidth: "6%", colorClass: "bg-gradient-pink" }
      ],
      age: [
        { label: "13-17", value: "0.2%", barWidth: "1%", colorClass: "bg-gradient-pink" },
        { label: "18-24", value: "15.4%", barWidth: "20%", colorClass: "bg-gradient-pink" },
        { label: "25-34", value: "41.2%", barWidth: "52%", colorClass: "bg-gradient-pink" },
        { label: "35-44", value: "25.1%", barWidth: "32%", colorClass: "bg-gradient-pink" },
        { label: "45-54", value: "12.8%", barWidth: "16%", colorClass: "bg-gradient-pink" },
        { label: "55-64", value: "3.5%", barWidth: "5%", colorClass: "bg-gradient-pink" },
        { label: "65+", value: "1.8%", barWidth: "2.5%", colorClass: "bg-gradient-pink" }
      ]
    };

    let currentAudienceCategory = 'country';

    // Verify Passcode
    function verifyCode() {
      const inputVal = document.getElementById('passcode-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      if (inputVal === '4610495') {
        document.getElementById('security-overlay').style.display = 'none';
        promptMetricsConfiguration();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Initial Setup Prompt Configuration
    function promptMetricsConfiguration() {
      setTimeout(() => {
        const views = prompt("Enter total Views count:", "3,321");
        const viewers = prompt("Enter Viewers count:", "2,561");
        const likes = prompt("Enter Likes count:", "55");
        const comments = prompt("Enter Comments count:", "0");
        const shares = prompt("Enter Shares count:", "0");
        const saves = prompt("Enter Saves count:", "0");

        if (views !== null) document.getElementById('card-views').innerText = views;
        if (viewers !== null) document.getElementById('card-viewers').innerText = viewers;

        if (likes !== null) {
          document.getElementById('top-likes').innerText = likes;
          document.getElementById('list-likes').innerText = likes;
        }
        if (comments !== null) {
          document.getElementById('top-comments').innerText = comments;
          document.getElementById('list-comments').innerText = comments;
        }
        if (shares !== null) {
          document.getElementById('top-shares').innerText = shares;
          document.getElementById('list-shares').innerText = shares;
        }
        if (saves !== null) {
          document.getElementById('top-saves').innerText = saves;
          document.getElementById('list-saves').innerText = saves;
        }

        renderAudienceCategory();
      }, 100);
    }

    // Tab Switching
    function switchMainTab(tabKey) {
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabKey}`).classList.add('active');
      document.getElementById(`view-${tabKey}`).classList.add('active');

      if (tabKey === 'audience') {
        renderAudienceCategory();
      }
    }

    // Audience Category Switching
    function switchAudienceCategory(catKey) {
      currentAudienceCategory = catKey;
      document.querySelectorAll('.pill-group .pill-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`pill-${catKey}`).classList.add('active');
      renderAudienceCategory();
    }

    function renderAudienceCategory() {
      const container = document.getElementById('dynamic-audience-list');
      container.innerHTML = '';

      const items = audienceData[currentAudienceCategory] || [];
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'data-row';
        row.innerHTML = `
          <div class="label-line" data-editable="true" data-cat="${currentAudienceCategory}" data-idx="${index}" data-type="label">${item.label}</div>
          <div class="bar-line">
            <div class="bar-bg">
              <div class="bar-fill ${item.colorClass}" style="width: ${item.barWidth};"></div>
            </div>
            <span class="percent-value" data-editable="true" data-cat="${currentAudienceCategory}" data-idx="${index}" data-type="value">${item.value}</span>
          </div>
        `;
        container.appendChild(row);
      });
      attachLongHoldHandlers();
    }

    // Thumbnail File Loader
    function loadThumbnail(event) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('thumbnail-img').src = reader.result;
        document.getElementById('mini-thumb-img').src = reader.result;
      };
      if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }

    // ==========================================
    // LONG-HOLD EDITABLE SYSTEM (Universal)
    // ==========================================
    let holdTimer = null;

    function attachLongHoldHandlers() {
      document.querySelectorAll('[data-editable="true"]').forEach(elem => {
        elem.removeEventListener('touchstart', handleTouchStart);
        elem.removeEventListener('touchend', handleTouchEnd);
        elem.removeEventListener('mousedown', handleMouseDown);
        elem.removeEventListener('mouseup', handleMouseUp);

        elem.addEventListener('touchstart', handleTouchStart);
        elem.addEventListener('touchend', handleTouchEnd);
        elem.addEventListener('mousedown', handleMouseDown);
        elem.addEventListener('mouseup', handleMouseUp);
      });
    }

    function startHold(elem) {
      holdTimer = setTimeout(() => {
        triggerEditPrompt(elem);
      }, 500);
    }

    function clearHold() {
      if (holdTimer) clearTimeout(holdTimer);
    }

    function handleTouchStart(e) { startHold(e.currentTarget); }
    function handleTouchEnd() { clearHold(); }
    function handleMouseDown(e) { startHold(e.currentTarget); }
    function handleMouseUp() { clearHold(); }

    function triggerEditPrompt(elem) {
      const currentText = elem.innerText.trim();
      const newText = prompt("Edit text/value:", currentText);
      if (newText !== null && newText !== "") {
        elem.innerText = newText;

        // Auto-update linked dynamic progress bar if present
        const linkedBarId = elem.getAttribute('data-bar');
        if (linkedBarId) {
          const numericVal = parseFloat(newText.replace('%', ''));
          if (!isNaN(numericVal)) {
            document.getElementById(linkedBarId).style.width = `${Math.min(100, Math.max(0, numericVal))}%`;
          }
        }

        // Auto-update underlying Audience array if dynamic element
        const cat = elem.getAttribute('data-cat');
        const idx = elem.getAttribute('data-idx');
        const type = elem.getAttribute('data-type');
        if (cat && idx !== null && type) {
          audienceData[cat][idx][type] = newText;
          if (type === 'value') {
            const numericVal = parseFloat(newText.replace('%', ''));
            if (!isNaN(numericVal)) {
              audienceData[cat][idx].barWidth = `${Math.min(100, Math.max(0, numericVal))}%`;
            }
            renderAudienceCategory();
          }
        }
      }
    }

    // ==========================================
    // TOUCH EDITABLE GRAPH CANVAS ENGINE (NO VISIBLE CIRCLES)
    // ==========================================
    class TouchGraphEngine {
      constructor(containerId, svgId, pathId, initialPoints, viewBoxWidth = 320, viewBoxHeight = 140) {
        this.container = document.getElementById(containerId);
        this.svg = document.getElementById(svgId);
        this.path = document.getElementById(pathId);
        this.points = initialPoints;
        this.vWidth = viewBoxWidth;
        this.vHeight = viewBoxHeight;
        this.dragNodeIndex = null;

        this.init();
      }

      init() {
        this.render();
        this.bindEvents();
      }

      bindEvents() {
        const handleStart = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const target = e.target;

          if (target.classList.contains('graph-node-hitbox')) {
            this.dragNodeIndex = parseInt(target.getAttribute('data-index'));
            e.preventDefault();
          } else {
            // Check proximity click to nearest point
            const rect = this.svg.getBoundingClientRect();
            const mouseX = ((clientX - rect.left) / rect.width) * this.vWidth;
            let closestIdx = -1;
            let minDist = Infinity;

            this.points.forEach((pt, idx) => {
              const dist = Math.abs(pt.x - mouseX);
              if (dist < minDist) {
                minDist = dist;
                closestIdx = idx;
              }
            });

            if (closestIdx !== -1 && minDist < 45) {
              this.dragNodeIndex = closestIdx;
              e.preventDefault();
            }
          }
        };

        const handleMove = (e) => {
          if (this.dragNodeIndex === null) return;

          const rect = this.svg.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          let x = ((clientX - rect.left) / rect.width) * this.vWidth;
          let y = ((clientY - rect.top) / rect.height) * this.vHeight;

          // Vertical Constraints
          y = Math.max(10, Math.min(this.vHeight - 10, y));

          // Clamp Horizontal X between neighboring points
          const minX = this.dragNodeIndex > 0 ? this.points[this.dragNodeIndex - 1].x + 10 : 0;
          const maxX = this.dragNodeIndex < this.points.length - 1 ? this.points[this.dragNodeIndex + 1].x - 10 : this.vWidth;
          x = Math.max(minX, Math.min(maxX, x));

          this.points[this.dragNodeIndex].x = x;
          this.points[this.dragNodeIndex].y = y;

          this.render();
          e.preventDefault();
        };

        const handleEnd = () => {
          this.dragNodeIndex = null;
        };

        this.svg.addEventListener('touchstart', handleStart, { passive: false });
        this.svg.addEventListener('touchmove', handleMove, { passive: false });
        this.svg.addEventListener('touchend', handleEnd);

        this.svg.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
      }

      // Smooth Curve Generation via Cubic Spline / Bezier
      getSmoothPath() {
        if (this.points.length < 2) return '';
        let d = `M ${this.points[0].x} ${this.points[0].y}`;

        for (let i = 0; i < this.points.length - 1; i++) {
          const p0 = this.points[i];
          const p1 = this.points[i + 1];
          const cpX1 = p0.x + (p1.x - p0.x) / 2;
          const cpY1 = p0.y;
          const cpX2 = p0.x + (p1.x - p0.x) / 2;
          const cpY2 = p1.y;

          d += ` C ${cpX1} ${cpY1}, ${cpX2} ${cpY2}, ${p1.x} ${p1.y}`;
        }
        return d;
      }

      render() {
        this.path.setAttribute('d', this.getSmoothPath());

        // Remove old hitboxes
        this.svg.querySelectorAll('.graph-node-hitbox').forEach(node => node.remove());

        // Create invisible hitboxes for seamless dragging without visible circles
        this.points.forEach((pt, idx) => {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', pt.x);
          circle.setAttribute('cy', pt.y);
          circle.setAttribute('r', 25); // Large touch area for smooth drag
          circle.setAttribute('class', 'graph-node-hitbox');
          circle.setAttribute('data-index', idx);
          this.svg.appendChild(circle);
        });
      }
    }

    // Initialize Interactive Graph Components
    document.addEventListener('DOMContentLoaded', () => {
      // Views Over Time Graph Engine
      new TouchGraphEngine('views-graph-container', 'views-svg', 'views-path', [
        { x: 0, y: 130 },
        { x: 80, y: 100 },
        { x: 160, y: 85 },
        { x: 260, y: 45 },
        { x: 320, y: 20 }
      ], 320, 140);

      // Audience Retention Graph Engine
      new TouchGraphEngine('retention-graph-container', 'retention-svg', 'retention-path', [
        { x: 0, y: 10 },
        { x: 50, y: 60 },
        { x: 150, y: 75 },
        { x: 220, y: 85 },
        { x: 300, y: 90 }
      ], 300, 120);

      attachLongHoldHandlers();
    });
  </script>
